<!DOCTYPE html>
<html lang="ja">

<head>
  <title>Gote-Supporter Config ジェネレーター </title>
  <link rel="stylesheet" type="text/css" href="/modan.css">
  <link rel="icon" href="/favicon.ico">
  <meta charset="utf-8" />
  <meta name="Description" content="Gote-SupporterのConfigを生成できます。" />
  <meta name="theme-color" content="#f3fca3" />
  <meta property="og:description" content="Gote-SupporterのConfigを生成できます。" />
  <meta property="og:site_name" content="©Yuka0745" />
  <meta property="og:title" content="Gote-Supporter Config ジェネレーター " />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    h1, h2, h3 {
      text-align: center;
    }
    div.toggleset {
      margin-top: 3px;
      margin-bottom: 3px;
    }
    details summary {
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

<script src="/jszip.min.js"></script>
<script src="./file/pack_icon.png.js"></script>

<body>
  <h2>Gote-Supporter Config ジュネレーター</h2>
  <hr>
  <div class="path">
    <a href="/">TOP</a> → <a href="/minecraft_addons/">マイクラ統合版 アドオン</a> → <a href="/minecraft_addons/gote-supporter.html">Gote-Supporter</a> → Gote-Supporter Config ジェネレーター
  </div>
  <hr>
  <p>
    ここでは、Gote-SupporterのConfigパックをかんたんに作ることができます！<br>
    Configパックは、Gote-Supporterの機能をカスタマイズできるパックです！
  </p>
  <div class="toggleset">
    <label class="input-field">
      <span class="title">パック名</span>
      <input type="text" id="pack_name" placeholder="Gote-Supporter Config Pack">
    </label>
  </div>
  <p>
    テンプレート
    <div class="btn-row">
      <input type="button" class="btn secondary" value="デフォルト" onclick="temprete('default')">
      <input type="button" class="btn secondary" value="Gote-Supporter Lite" onclick="temprete('lite')">
    </div>
  </p>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="hud_compass">
      <span class="slider"></span>
      <span class="label-text">HUDにコンパスと時計を表示</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="start_screen_gamertag">
      <span class="slider"></span>
      <span class="label-text">タイトル画面にゲーマータグとアイコンを表示</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="show_gote_version">
      <span class="slider"></span>
      <span class="label-text">タイトル画面にGote-Supporterの情報を表示</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="show_build_number">
      <span class="slider"></span>
      <span class="label-text">タイトル画面にマイクラのビルド番号を表示</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="inventory_screen_statusbar">
      <span class="slider"></span>
      <span class="label-text">インベントリ画面などにHPや空腹度などを表示</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="chest_screen_paperdoll">
      <span class="slider"></span>
      <span class="label-text">チェスト画面などに自分の人形を表示</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="show_hotbar_navigator">
      <span class="slider"></span>
      <span class="label-text">HUDにホットバーナビゲーターの表示（タッチ操作用）</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="show_hotbar_number">
      <span class="slider"></span>
      <span class="label-text">ホットバーに数字を表示</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="toggle">
      <input type="checkbox" id="show_locked_trade_items">
      <span class="slider"></span>
      <span class="label-text">未解放の取引アイテムをプレビュー表示</span>
    </label>
  </div>
  <div class="toggleset">
    <label class="input-field">
      <span class="title">HUDのF1・F8ボタン （タッチ操作用）</span>
      <div class="select-wrap">
        <select id="f1_f8_location">
          <option id="right">右下に表示</option>
          <option id="top">上に表示</option>
          <option id="none">非表示</option>
        </select>
      </div>
    </label>
  </div>
  <div class="toggleset">
    <label class="input-field">
      <span class="title">チャットのTab・履歴ボタン</span>
      <div class="select-wrap">
        <select id="chat_tab_button_type">
          <option id="vertical">右下に並べて表示</option>
          <option id="horizontal">下のチャット設定ボタンなどと並べて表示</option>
          <option id="none">非表示</option>
        </select>
      </div>
    </label>
  </div>
  <div class="toggleset">
    <label class="input-field">
      <span class="title">HUDでプレイヤーリストを表示するキー</span>
      <div class="select-wrap">
        <select id="playerlist_key">
          <option id="tab">Tabキー</option>
          <option id="f10">F10キー</option>
          <option id="none">使わない</option>
        </select>
      </div>
    </label>
  </div>
  <p>
    <details>
      <summary>その他の設定</summary>
      <div class="toggleset">
        <label class="toggle">
          <input type="checkbox" id="play_screen_doubleclick">
          <span class="slider"></span>
          <span class="label-text">プレイ画面のワールドのボタンをダブルクリックしないと入れないようにする (旧プレイ画面用)</span>
        </label>
      </div>
      <div class="toggleset">
        <label class="toggle">
          <input type="checkbox" id="show_recoverycompass">
          <span class="slider"></span>
          <span class="label-text">HUDのコンパスにリカバリーコンパスを表示<b>【不安定】</b></span>
        </label>
      </div>
      <div class="toggleset">
        <label class="toggle">
          <input type="checkbox" id="enable_force_trade">
          <span class="slider"></span>
          <span class="label-text">未解放の取引アイテムを強制的に購入できるようにする</span>
        </label>
      </div>
    </details>
  </p>
  
  <div class="btn-row">
    <input type="button" class="btn primary" value="ダウンロード" onclick="mcpack()">
  </div>
  <hr>
  <div style="text-align: center;">優香のサイト ©Yuka0745</div>
</body>


<script>
  function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    })
  }

  function getCheck(elem = "") {
    return document.getElementById(elem).checked;
  }

  function setCheck(elem = "", val = false) {
    document.getElementById(elem).checked = val;
  }

  function temprete(a = "default") {
    if (a === "default") {
      document.getElementById("hud_compass").checked = true
      document.getElementById("start_screen_gamertag").checked = true
      document.getElementById("show_gote_version").checked = true
      document.getElementById("show_build_number").checked = false
      document.getElementById("inventory_screen_statusbar").checked = true
      document.getElementById("chest_screen_paperdoll").checked = true
      document.getElementById("show_hotbar_navigator").checked = false
      document.getElementById("show_hotbar_number").checked = false
      document.getElementById("play_screen_doubleclick").checked = false
      document.getElementById("show_recoverycompass").checked = false
      document.getElementById("show_locked_trade_items").checked = true
      document.getElementById("enable_force_trade").checked = false
      document.getElementById("f1_f8_location").selectedIndex = 0
      document.getElementById("chat_tab_button_type").selectedIndex = 0
      document.getElementById("playerlist_key").selectedIndex = 0
      return
    }

    if (a === "lite") {
      document.getElementById("hud_compass").checked = false
      document.getElementById("start_screen_gamertag").checked = false
      document.getElementById("show_gote_version").checked = false
      document.getElementById("show_build_number").checked = false
      document.getElementById("inventory_screen_statusbar").checked = true
      document.getElementById("chest_screen_paperdoll").checked = true
      document.getElementById("show_hotbar_navigator").checked = false
      document.getElementById("show_hotbar_number").checked = false
      document.getElementById("play_screen_doubleclick").checked = false
      document.getElementById("show_recoverycompass").checked = false
      document.getElementById("show_locked_trade_items").checked = true
      document.getElementById("enable_force_trade").checked = false
      document.getElementById("f1_f8_location").selectedIndex = 2
      document.getElementById("chat_tab_button_type").selectedIndex = 1
      document.getElementById("playerlist_key").selectedIndex = 0
      return
    }
  }
  function mcpack() {
    let packname = document.getElementById("pack_name").value;

    let global_variables = {
      "$hud_compass": getCheck("hud_compass"),
      "$start_screen_gamertag": getCheck("start_screen_gamertag"),
      "$show_gote_version": getCheck("show_gote_version"),
      "$show_build_number": getCheck("show_build_number"),
      "$inventory_screen_statusbar": getCheck("inventory_screen_statusbar"),
      "$chest_screen_paperdoll": getCheck("chest_screen_paperdoll"),
      "$show_hotbar_navigator": getCheck("show_hotbar_navigator"),
      "$show_hotbar_number": getCheck("show_hotbar_number"),
      "$play_screen_doubleclick": getCheck("play_screen_doubleclick"),
      "$show_recoverycompass": getCheck("show_recoverycompass"),
      "$show_locked_trade_items": getCheck("show_locked_trade_items"),
      "$enable_force_trade": getCheck("enable_force_trade"),
      "$f1_f8_location": document.getElementById("f1_f8_location").selectedOptions[0].id,
      "$chat_tab_button_type": document.getElementById("chat_tab_button_type").selectedOptions[0].id,
      "$playerlist_key": document.getElementById("playerlist_key").selectedOptions[0].id
    }

    let manifestjson = JSON.stringify({
      format_version: 2,
      header: {
        name: packname === "" ? "Gote-Supporter Config Pack" : packname,
        description: "Gote-SupporterをカスタマイズできるConfigパックです！\nGote-Supporter Config ジェネレーターで生成\nby Yuka0745",
        version: [ 1, 0, 0 ],
        uuid: generateUUID(),
        min_engine_version: [ 1, 13, 0 ],
        pack_scope: "global"
      },
      modules: [
        {
          type: "resources",
          version: [ 1, 0, 0 ],
          uuid: generateUUID()
        }
      ],
      metadata: {
        url: "https://gotemba912.github.io/minecraft_addons/gote-supporter-config/",
        generated_with: {
          "Gote-Supporter_ConfigGenerator": ["1.1.0"]
        }
      }
    },null, 2);


    let zip = new JSZip()
    zip.file("manifest.json", manifestjson)
    zip.file("pack_icon.png", pack_iconpng, { base64: true })
    zip.file("ui/_global_variables.json", JSON.stringify(global_variables, null, 2))

    zip.generateAsync({ type: "blob" }).then(function (content) {
      let link = document.createElement('a')
      link.download = "Gote-Supporter_Config.mcpack"
      link.href = URL.createObjectURL(content)
      link.click()
      URL.revokeObjectURL(link.href)
    })
  }
</script>

</html>
