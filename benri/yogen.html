<body>
  <div class="main">
    <header><img width="48" height="48" src="/textures/app_icon.png" alt="優香のサイトのアイコン"><a class="headertext" href="/">優香のサイト</a></header>
    <div class="maincontent">
      <div class="path">
        <a href="/">TOP</a> → <a href="/benri/">その他雑貨</a> → 予言
      </div>
      <h2>予言</h2>
      <input type="button" id="togglesound" value="サウンドをOFFにする" onclick="toggleSoundPlay()"> <b>←このサイトは音がなります! 消したいときはここから</b>
      <div id="settings">
        <p>
          ニックネーム<br>
          <input type="input" id="yourname">
        </p>
        <p>
          <input type="button" id="play" value="開始する" onclick="yogenPlay()">

      </div>
      <audio id="playsound"></audio>
      <div id="yogenpanel">

</body>

<script>

  ],

    "大阪",
    "メタバース",
    "テイワット",
    "電車の駅",
    "空港",
    "曲がり角",
    "新幹線の車内",
    "京急線の車内",
    "コンビニ",
    "/EON",
    "無人島",
    "大物YouTubeｒの自宅",
    "イオンシネマ",
    "横浜",
    "ココナッツモール",
    "日本放送協会",
    "マクド",
    "Microsoft本社",
    "The HiveのHub"
  ],
  do: [
    "バンジージャンプをする",
    "ペットを飼う",
    "化け物になる",
    "勉強をする",
    "PCをする",
    "部活をする",
    "ねる",
    "危険な実験をする",
    "爆破する",
    "ゲームをする",
    "フラれる",
    "奇行に走る",
    "ふざける",
    "ガチギレする",
    "FPSをする",
    "分身する",
    "HDD壊れる",
    "SSD壊れる",
    "洗脳される",
    "ロボット操縦をする",
    "ボートレースをする",
    "スマホを落とす"
  ],
  doit: [
    "あくびをして",
    "勉強をして",
    "冒険に出て",
    "PCをして",
    "SNSで拡散して",
    "死んだふりをして",
    "見て見ぬふりをして",
    "告白して",
    "結婚して",
    "最高におかしくなって",
    "牛になって",
    "台パンして",
    "叫んで",
    "助けて",
    "ふざけて",
    "怒って",
    "寝て",
    "地下に潜って",
    "大統領になって",
    "変態になって",
    "踊って",
    "歌って",
    "鬼になって",
    "家になって",
    "静かに立ち去って"
  ]
}

let soundPlay = true;

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function yogenPlay() {
  const yourname = document.getElementById("yourname");
  const pretext = document.getElementById("pretext");
  const bigtext = document.getElementById("bigtext");
  const playsound = document.getElementById("playsound");
  const play = document.getElementById("play");

  const bun = {
    when: "",
    who: "",
    where: "",
    do: "",
    doit: ""
  }

  bun.when = tango.when[Math.floor(Math.random() * tango.when.length)];
  bun.who = yourname.value;
  bun.where = tango.where[Math.floor(Math.random() * tango.where.length)];
  bun.do = tango.do[Math.floor(Math.random() * tango.do.length)];
  bun.doit = tango.doit[Math.floor(Math.random() * tango.doit.length)];

  play.disabled = true;
  yourname.disabled = true;

  playsound.src = "./assets/jyan.wav";
  bigtext.textContent = "";
  pretext.textContent = `${bun.when}、`;
  if (soundPlay) playsound.play();
  await sleep(1000);

  pretext.textContent = `${bun.when}、${bun.who}は`;
  if (soundPlay) playsound.play();
  await sleep(1000);
  
  pretext.textContent = `${bun.when}、${bun.who}は${bun.where}で`;
  if (soundPlay) playsound.play();
  await sleep(1000);
  
  pretext.textContent = `${bun.when}、${bun.who}は${bun.where}で${bun.do}ので...`;
  if (soundPlay) playsound.play();
  await sleep(2000);
  
  playsound.src = "./assets/dia.wav";
  bigtext.textContent = `${bun.doit}ください。`;
  pretext.textContent = "";
  if (soundPlay) playsound.play();
  await sleep(6000);

  bigtext.textContent = "";
  pretext.innerText = `${bun.when}、${bun.who}は${bun.where}で${bun.do}ので...\n${bun.doit}ください。`;
  
  play.disabled = false;
  yourname.disabled = false;
}

function toggleSoundPlay() {
  soundPlay = !soundPlay;
  document.getElementById("togglesound").value = soundPlay ? "サウンドをOFFにする" : "サウンドをONにする";
}

</script>
</html>
